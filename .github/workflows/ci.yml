# CI cho EC-VoucherHub — monorepo npm workspaces (shared + backend + frontend).
# Stack: TypeScript/Node, Express, Prisma, React + Vite, Vitest + fast-check.
# Các lệnh dưới đây bám theo scripts trong package.json (gốc + từng workspace).
# Một số script (lint/test) hiện chưa được khai báo nên dùng `--if-present`
# để CI không vỡ ở giai đoạn scaffold; chúng sẽ tự chạy khi script được thêm.

name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

# Hủy các lần chạy cũ trên cùng một nhánh/PR khi có commit mới.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voucherhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d voucherhub_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voucherhub_test
      NODE_ENV: test
      JWT_SECRET: test-secret-at-least-32-characters
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma chưa có schema ở giai đoạn scaffold → chỉ generate khi đã có schema,
      # tránh CI đỏ trước khi Task 2.1 (Prisma schema) hoàn thành.
      - name: Prisma generate (nếu đã có schema)
        run: |
          if [ -f backend/prisma/schema.prisma ]; then
            npm run db:generate
          else
            echo "Chưa có backend/prisma/schema.prisma — bỏ qua prisma generate."
          fi

      - name: Apply test database migrations
        run: npm run db:deploy --workspace=backend

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Typecheck tests
        run: npm run typecheck:test --workspace=backend

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage --workspace=backend

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/coverage/**"
          if-no-files-found: ignore
